{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flashes" role="status">
    {% for category, message in messages %}
      <div class="flash {{ category if category in ('success','error','warning','info') else 'info' }}">
        <span>{{ message }}</span>
        <button type="button" class="flash-close" aria-label="Закрыть">×</button>
      </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
