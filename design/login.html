<div class="auth">
  <section class="auth-aside">
    <div class="brand" style="padding:0;border:0">
      <div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-trace"/></svg></div>
      <div>
        <div class="brand-name">ТрассаТреб</div>
        <div class="brand-sub">Инженерные требования и трассируемость</div>
      </div>
    </div>
    <div>
      <h2>Панель администратора</h2>
      <p>Справочники требований, проекты и права доступа участников, журнал действий и резервные копии базы данных.</p>
    </div>
    <div class="foot">Доступ только для сотрудников с ролью «Администратор».</div>
  </section>
  <section class="auth-panel">
    <form method="post" class="auth-form" novalidate>
      
      <div>
        <h1>Вход в систему</h1>
        <div class="muted">Укажите логин и пароль учётной записи</div>
      </div>
      
  

      <div class="field  ">
  <label for="login">Логин</label>
  
    <input class="input" id="login" maxlength="50" minlength="3" name="login" required type="text" value="">
  
  
  
</div>
      <div class="field  ">
  <label for="password">Пароль</label>
  
    <input class="input" id="password" maxlength="128" minlength="3" name="password" required type="password" value="">
  
  
  
</div>
      <label class="check"><input id="remember" name="remember" type="checkbox" value="y"> Запомнить меня</label>
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
  </section>
</div>

<script src="../static/js/admin.js"></script>
